name: Build Stellar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          target: Android64

      - name: Upload Stellar
        uses: actions/upload-artifact@v4
        with:
          name: Stellar-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode